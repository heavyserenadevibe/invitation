<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sampul Undangan</title>
    <!-- Import Google Fonts: Roboto & Satisfy -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&family=Satisfy&display=swap" rel="stylesheet">
    <!-- FontAwesome untuk Icon Tombol -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            /* Memanggil gambar lokal PIC01 Sampul.jpg sebagai background dengan efek gelap tipis agar teks lebih terbaca */
            background-image: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), url('PIC01 Sampul.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Roboto', sans-serif;
            text-align: center;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cover-container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Teks The Wedding Of (Font Roboto Regular) */
        .wedding-label {
            font-family: 'Roboto', sans-serif;
            font-weight: 400;
            font-size: clamp(1rem, 3.5vw, 1.2rem);
            color: #ffffff;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 12px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        /* Teks Nama Pasangan (Font Satisfy) */
        .couple-name {
            font-family: 'Satisfy', cursive;
            font-size: clamp(2.5rem, 8vw, 3.8rem);
            font-weight: normal;
            color: #ffffff;
            margin-bottom: 25px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
        }

        /* Area Tamu Undangan Tanpa Kotak (Polos) */
        .guest-section {
            margin-bottom: 25px;
            width: 100%;
            padding: 0 10px;
        }

        .guest-title {
            font-size: 0.9rem;
            color: #f1f5f9;
            margin-bottom: 6px;
            font-weight: 400;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
        }

        .guest-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            word-break: break-word;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
        }

        .guest-note {
            font-size: 9px;
            color: #e2e8f0;
            opacity: 0.9;
            line-height: 1.3;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        }

        /* Tombol Buka Undangan dengan Efek Animasi & Kilau */
        .btn-open {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 28px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #ffffff;
            font-family: 'Roboto', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
            animation: pulseBtn 2.5s infinite;
        }

        .btn-open::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 45%,
                rgba(255, 255, 255, 0.6) 50%,
                transparent 55%
            );
            transform: rotate(35deg) translateX(-100%);
            animation: shine 3s infinite linear;
        }

        @keyframes shine {
            0% { transform: rotate(35deg) translateX(-100%); }
            20% { transform: rotate(35deg) translateX(100%); }
            100% { transform: rotate(35deg) translateX(100%); }
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); }
            70% { transform: scale(1.04); box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        .btn-open:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(1.06);
        }
    </style>
</head>
<body>

    <div class="cover-container">
        <!-- Teks Tema & Nama Pasangan (Font Satisfy) -->
        <div class="wedding-label">The Wedding Of</div>
        <div class="couple-name">Anya & Julian</div>

        <!-- Kolom Nama Tamu Undangan (Polos Tanpa Kotak) -->
        <div class="guest-section">
            <div class="guest-title">Kepada Yth.</div>
            <div class="guest-name" id="guestName">Tamu Undangan</div>
            <div class="guest-note">Mohon maaf apabila ada kesalahan dalam penulisan gelar atau nama</div>
        </div>

        <!-- Tombol Buka Undangan -->
        <a href="https://sites.google.com/view/bayri-pic01/home" class="btn-open" id="openBtn">
            <i class="fa-solid fa-envelope-open-text"></i> Buka Undangan
        </a>
    </div>

    <script>
        // Skrip untuk membaca nama tamu dari URL (format: ?to=Nama+Tamu)
        const urlParams = new URLSearchParams(window.location.search);
        const guestParam = urlParams.get('to');
        
        if (guestParam) {
            document.getElementById('guestName').innerText = guestParam.replace(/_/g, ' ');
        }
    </script>
</body>
</html>
