<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wedding of Anya & Julian</title>
    
    <!-- Import Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&family=Satisfy&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: 'Montserrat', sans-serif;
            color: #FFFFFF;
            overflow: hidden;
            background-color: #000;
        }

        /* Transisi Halaman Keluar */
        .page-transition {
            opacity: 1;
            transition: opacity 0.8s ease-in-out;
        }

        .page-fade-out {
            opacity: 0;
        }

        /* Container Penuh Layar dengan Distribusi Jarak Proporsional */
        .cover-container {
            background-image: url('PIC01 Sampul.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 80px 20px 60px 20px;
        }

        /* Header Nama Pengantin */
        .header-title .sub-title {
            font-family: 'Oswald', sans-serif;
            font-size: 15px;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 8px;
            opacity: 0.9;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .header-title .main-title {
            font-family: 'Satisfy', cursive;
            font-size: 68px;
            line-height: 1.2;
            font-weight: normal;
            text-shadow: 0 4px 12px rgba(0,0,0,0.9);
        }

        /* Container Bawah (Nama Tamu & Tombol) */
        .bottom-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* Area Nama Tamu */
        .guest-section {
            margin-bottom: 30px;
        }

        .guest-section .yth {
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 300;
            margin-bottom: 8px;
            opacity: 0.9;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .guest-section .guest-name {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 6px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        }

        .guest-section .location {
            font-size: 13px;
            font-weight: 300;
            opacity: 0.8;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            margin-bottom: 8px;
        }

        /* Catatan Kecil Permohonan Maaf */
        .apology-note {
            font-size: 8px;
            font-weight: 300;
            opacity: 0.7;
            letter-spacing: 0.5px;
            max-width: 280px;
            line-height: 1.3;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* Tombol Buka Undangan Elegan dengan Animasi */
        @keyframes softPulse {
            0% { transform: scale(1); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); }
            50% { transform: scale(1.03); box-shadow: 0 6px 20px rgba(255, 255, 255, 0.25); }
            100% { transform: scale(1); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); }
        }

        .btn-open {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            color: #FFFFFF;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 14px 34px;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 30px;
            backdrop-filter: blur(8px);
            cursor: pointer;
            animation: softPulse 3s infinite ease-in-out;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .btn-open svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
            transition: transform 0.3s ease;
        }

        .btn-open:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.8);
            transform: translateY(-2px);
        }

        .btn-open:hover svg {
            transform: translateX(4px);
        }
    </style>
</head>
<body class="page-transition">

    <div class="cover-container">
        <!-- Bagian Atas: Judul & Nama Pengantin -->
        <div class="header-title">
            <p class="sub-title">The Wedding Of</p>
            <h1 class="main-title">Anya &amp; Julian</h1>
        </div>

        <!-- Bagian Bawah: Nama Tamu & Tombol -->
        <div class="bottom-container">
            <div class="guest-section">
                <p class="yth">Kepada Yth. Tamu Undangan</p>
                <h2 class="guest-name" id="nama-tamu">Tamu Undangan</h2>
                <p class="location">di Tempat</p>
                <p class="apology-note">Mohon maaf apabila ada kesalahan dalam penulisan nama dan gelar.</p>
            </div>

            <a href="https://sites.google.com/view/bayri-invitation/invitation" class="btn-open" id="open-btn">
                <span>Buka Undangan</span>
                <svg viewBox="0 0 24 24"><path d="M5 13h11.586l-5.293 5.293 1.414 1.414L21.414 12l-7.707-7.707-1.414 1.414L16.586 11H5z"/></svg>
            </a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const nama = urlParams.get('to');
        if (nama) {
            document.getElementById('nama-tamu').textContent = decodeURIComponent(nama);
        }

        // Efek Transisi Animasi Keluar saat Tombol Diklik
        const openBtn = document.getElementById('open-btn');
        openBtn.addEventListener('click', function(e) {
            e.preventDefault();
            const targetUrl = this.getAttribute('href');
            
            document.body.classList.add('page-fade-out');
            
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 800);
        });
    </script>

</body>
</html>
