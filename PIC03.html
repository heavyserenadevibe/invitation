<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wedding of Anya & Julian</title>
<!-- Mengimpor Google Font: Montserrat & Yeseva One -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Yeseva+One&display=swap" rel="stylesheet">
 
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
 
  body {
    margin: 0;
    padding: 0;
    background: #000000;
    font-family: 'Montserrat', sans-serif;
    color: #ffffff;
    overflow-x: hidden;
    width: 100vw;
    min-height: 100vh;
  }
 
  /* Wrapper Utama Full Layar Android / Web View */
  .moment-section {
    position: relative;
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }
 
  /* Container Slider Background Foto Berjalan Full Layar */
  .slider-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    z-index: 1;
  }
 
  .slider-track {
    display: flex;
    height: 100vh;
    width: max-content;
    animation: scrollSlider 30s linear infinite;
    pointer-events: none;
  }
 
  .photo-card {
    width: 100vw;
    height: 100vh;
    flex-shrink: 0;
    overflow: hidden;
    background: transparent;
    pointer-events: auto;
  }
 
  .photo-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
    pointer-events: none;
  }
 
  @keyframes scrollSlider {
    0% {
      transform: translateX(0);
    }
    100% {
      transform: translateX(-50%);
    }
  }
 
  /* Overlay Gelap Transparan agar Teks Terbaca Jelas di Atas Foto */
  .overlay-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(0, 0, 0, 0.45);
    z-index: 2;
    pointer-events: none;
  }
 
  /* Container Konten Teks Cover di atas Background */
  .invitation-wrapper {
    position: relative;
    width: 100%;
    min-height: 100vh;
    padding: clamp(20px, 4vw, 40px) clamp(15px, 4vw, 30px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 3;
    text-align: center;
  }
 
 .invitation-container {
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px;
  }
 
  /* Keyframes Animasi Masuk & Elegan */
  .scroll-animate {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 1.5s cubic-bezier(0.16, 1, 0.3, 1), transform 1.5s cubic-bezier(0.16, 1, 0.3, 1);
    will-change: opacity, transform;
  }
 
 .scroll-animate.active {
    opacity: 1;
    transform: translateY(0);
  }
 
  /* Teks Tamu Undangan */
  .guest-salutation {
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    font-size: 8px;
    color: rgba(255, 255, 255, 0.85);
    margin-bottom: 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
 
  /* Frame Kotak Blurry Tipis untuk Nama Tamu */
  .guest-box {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 8px;
    padding: 10px 20px;
    margin-bottom: 25px;
    min-width: 220px;
    max-width: 90%;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
  }
 
  .guest-name {
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 11px;
    color: #ffffff;
    letter-spacing: 0.5px;
  }
 
  /* Tombol Buka Undangan dengan Animasi Pulse */
  @keyframes pulseButton {
    0% {
      box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4);
    }
    70% {
      box-shadow: 0 0 0 10px rgba(255, 255, 255, 0);
    }
    100% {
      box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
    }
  }
 
  .open-button {
    display: inline-block;
    padding: 10px 24px;
    background-color: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.5);
    border-radius: 30px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 500;
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #ffffff;
    text-decoration: none;
    transition: all 0.3s ease;
    animation: pulseButton 2.5s infinite;
    cursor: pointer;
  }
 
  .open-button:hover {
    background-color: #ffffff;
    color: #000000;
    transform: translateY(-2px);
  }
</style>
</head>
<body>
 
  <section class="moment-section">
    <!-- Container Slider Background Foto Berjalan Full Layar -->
    <div class="slider-container" id="sliderContainer">
      <div class="slider-track" id="sliderTrack">
        <!-- Set 1 -->
        <div class="photo-card"><img src="https://lh3.googleusercontent.com/d/1Cv7gnXx68XskZjpbQHXTVU9NHQOzbSm0=s800" alt="Moment 1"></div>
        <div class="photo-card"><img src="https://lh3.googleusercontent.com/d/1x8Ybg4aE77i-SzbMCcfmGguGPCJ_HBGd=s800" alt="Moment 2"></div>
        <div class="photo-card"><img src="https://lh3.googleusercontent.com/d/1grwW23VT-H-a-4KuETjK1ynw48DZOCvP=s800" alt="Moment 3"></div>
        <div class="photo-card"><img src="https://lh3.googleusercontent.com/d/1YHkfQh5vZjwTpBqcFDqnfzDL_tnVy4tb=s800" alt="Moment 4"></div>
        <div class="photo-card"><img src="https://lh3.googleusercontent.com/d/10sy37hpkyAioLfTysHDQcr7TZCEIkzAy=s800" alt="Moment 5"></div>
 
        <!-- Set 2 (Duplikasi untuk Seamless Infinite Loop) -->
        <div class="photo-card"><img src="https://lh3.googleusercontent.com/d/1Cv7gnXx68XskZjpbQHXTVU9NHQOzbSm0=s800" alt="Moment 1"></div>
        <div class="photo-card"><img src="https://lh3.googleusercontent.com/d/1x8Ybg4aE77i-SzbMCcfmGguGPCJ_HBGd=s800" alt="Moment 2"></div>
        <div class="photo-card"><img src="https://lh3.googleusercontent.com/d/1grwW23VT-H-a-4KuETjK1ynw48DZOCvP=s800" alt="Moment 3"></div>
        <div class="photo-card"><img src="https://lh3.googleusercontent.com/d/1YHkfQh5vZjwTpBqcFDqnfzDL_tnVy4tb=s800" alt="Moment 4"></div>
        <div class="photo-card"><img src="https://lh3.googleusercontent.com/d/10sy37hpkyAioLfTysHDQcr7TZCEIkzAy=s800" alt="Moment 5"></div>
      </div>
    </div>
 
    <!-- Overlay Gelap Full Layar agar Teks Tetap Jelas -->
    <div class="overlay-bg"></div>
 
    <!-- Konten Teks Undangan (Hanya Nama Tamu & Tombol Menuju Halaman Utama/GitHub) -->
    <div class="invitation-wrapper">
      <div class="invitation-container">
        
        <!-- Bagian Tamu Undangan -->
        <div class="guest-salutation scroll-animate" style="transition-delay: 0.2s;">
          Kepada Yth. Bapak/Ibu/Saudara/i
        </div>
 
        <!-- Frame Kotak Blurry Tipis untuk Nama Tamu -->
        <div class="guest-box scroll-animate" style="transition-delay: 0.3s;">
          <div id="guestNameContainer" class="guest-name">
            Tamu Undangan
          </div>
        </div>
 
        <!-- Tombol Buka Undangan yang Mengarah ke File Utama GitHub Anda -->
        <!-- Ubah "main.html" sesuai dengan nama file halaman utama undangan Anda di repository GitHub -->
        <a href="main.html" id="openInvitationBtn" class="open-button scroll-animate" style="transition-delay: 0.4s;">
          Buka Undangan
        </a>
 
      </div>
    </div>
  </section>
 
  <script>
    // Script untuk menangkap parameter URL ?to=Nama+Tamu secara otomatis
    document.addEventListener("DOMContentLoaded", function () {
      const urlParams = new URLSearchParams(window.location.search);
      const guestParam = urlParams.get('to');
      
      if (guestParam) {
        let formattedName = decodeURIComponent(guestParam.replace(/\+/g, ' '));
        document.getElementById('guestNameContainer').textContent = formattedName;
      }
 
      // Script untuk Animasi Masuk (Scroll Animation)
      const observerOptions = {
        root: null,
        rootMargin: '0px',
        threshold: 0.15
      };
 
      const observer = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('active');
          } else {
            entry.target.classList.remove('active');
          }
        });
      }, observerOptions);
 
      const animatedElements = document.querySelectorAll('.scroll-animate');
      animatedElements.forEach(el => observer.observe(el));
    });
  </script>
 
</body>
</html>
