<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wedding of Anya & Julian</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            color: #FFFFFF;
        }
        /* Menggunakan Gambar Latar Belakang Utama */
        .hero {
            background-image: url('bg.jpg');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 60px 20px 80px 20px;
        }
        .title-section h3 {
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 300;
            margin-bottom: 10px;
            opacity: 0.9;
        }
        .title-section h1 {
            font-family: 'Georgia', serif;
            font-size: 48px;
            font-weight: normal;
            line-height: 1.2;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        .guest-section {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px 30px;
            border-radius: 12px;
            backdrop-filter: blur(2px);
        }
        .guest-section p.yth {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
            opacity: 0.8;
        }
        .guest-section h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 6px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }
        .guest-section p.alamat {
            font-size: 13px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="hero">
        <!-- Judul Atas -->
        <div class="title-section">
            <h3>THE WEDDING OF</h3>
            <h1>Anya<br>&amp;<br>Julian</h1>
        </div>

        <!-- Nama Tamu Otomatis -->
        <div class="guest-section">
            <p class="yth">KEPADA YTH</p>
            <h2 id="nama-tamu">Tamu Undangan</h2>
            <p class="alamat">DI TEMPAT</p>
        </div>
    </div>

    <script>
        // Membaca Nama Tamu Otomatis dari URL (?to=Nama)
        const urlParams = new URLSearchParams(window.location.search);
        const nama = urlParams.get('to');
        if (nama) {
            document.getElementById('nama-tamu').textContent = decodeURIComponent(nama);
        }
    </script>

</body>
</html>
